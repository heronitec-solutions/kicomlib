name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  Build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build plugin package
        run: python build_package.py
      - name: Require the package archive
        run: test -s out/kicomlib.zip

  Tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: pip install pytest==9.1.1 requests==2.32.3
      - name: Run tests
        run: pytest

  Linter:
    name: Linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install Ruff
        run: pip install ruff==0.17.0
      - name: Lint
        run: ruff check .
